[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qpm"]

[project]
name = "qpm"
version = "0.1.0"
requires-python = ">=3.12"
authors = [
    { name = "Federico Gasparoli", email = "federico.gasparoli@gmail.com" },
]

dependencies = [
    "numpy",
    "pyqt6",
    "superqt[iconify]",
    "cellpose",
    "tifffile",
    "matplotlib",
    "scipy",
    "pandas",
    "scikit-image",
]

[project.scripts]
qpm = "qpm.__main__:main"
