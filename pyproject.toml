[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qpm"]

[project]
name = "qpm"
version = "0.1.0"
requires-python = ">=3.11"
authors = [
    { name = "Federico Gasparoli", email = "federico.gasparoli@gmail.com" },
]

dependencies = [
    "numpy",
    "pyqt6",
    "superqt[iconify]",
    "cellpose",
    "tifffile",
    "matplotlib",
    "scipy",
    "pandas",
    "scikit-image",
]

[project.optional-dependencies]
# to override the default PyTorch installation form Cellpose with the CUDA version.
# has to be usesd with uvx as explained in the README.
cuda = [
    "torch",
    "torchvision"
]

[dependency-groups]
dev = [
    "ipython",
    "mypy",
    "pre-commit-uv",
    "rich",
    "ruff",
]

[project.scripts]
qpm = "qpm.__main__:main"

[tool.typos.default]
extend-ignore-identifiers-re = ["(?i)ome"]